<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অনলাইন পেমেন্ট (bKash / Nagad) - OKXPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
    .method-card.active { border-color: #38bdf8; background-color: rgba(56, 189, 248, 0.1); }
    .quick-amt.active { border-color: #38bdf8; background-color: #0284c7; color: #ffffff; }
  </style>
</head>
<body class="bg-[#03091e] text-white min-h-screen flex items-center justify-center p-4">

  <!-- Payment Checkout Card -->
  <div class="w-full max-w-md bg-[#07153b] border border-[#163677] rounded-3xl p-6 shadow-2xl space-y-5">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-[#122e6b] pb-4">
      <div>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          <span>💳</span>
          <span>অনলাইন পেমেন্ট গেটওয়ে</span>
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">নিরাপদ ও দ্রুততম স্বয়ংক্রিয় পেমেন্ট</p>
      </div>
      <span class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-[11px] font-bold border border-emerald-500/30">
        SSL Secured
      </span>
    </div>

    <!-- Payment Form -->
    <form id="payment-form" class="space-y-4" onsubmit="event.preventDefault(); initiatePayment();">

      <!-- 1. Payment Method Selection -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">
          পেমেন্ট মেথড নির্বাচন করুন:
        </label>
        <div class="grid grid-cols-2 gap-3">
          
          <!-- bKash Option -->
          <label id="bkash-card" class="method-card active flex items-center justify-between p-3 rounded-2xl bg-[#040d29] border border-[#1b3e85] cursor-pointer hover:border-[#38bdf8] transition select-none">
            <div class="flex items-center gap-2.5">
              <input type="radio" name="payType" value="BKASH" checked class="hidden" onchange="selectMethod('BKASH')">
              <div class="w-8 h-8 rounded-full bg-[#e2136e] flex items-center justify-center font-bold text-white text-xs shadow">
                bK
              </div>
              <div>
                <div class="text-xs font-bold text-white leading-tight">বিকাশ</div>
                <div class="text-[10px] text-slate-400">bKash Pay</div>
              </div>
            </div>
            <div id="bkash-radio-dot" class="w-4 h-4 rounded-full border-2 border-[#38bdf8] flex items-center justify-center">
              <div class="w-2 h-2 rounded-full bg-[#38bdf8]"></div>
            </div>
          </label>

          <!-- Nagad Option -->
          <label id="nagad-card" class="method-card flex items-center justify-between p-3 rounded-2xl bg-[#040d29] border border-[#1b3e85] cursor-pointer hover:border-[#38bdf8] transition select-none">
            <div class="flex items-center gap-2.5">
              <input type="radio" name="payType" value="NAGAD" class="hidden" onchange="selectMethod('NAGAD')">
              <div class="w-8 h-8 rounded-full bg-[#f7931e] flex items-center justify-center font-bold text-white text-xs shadow">
                নগদ
              </div>
              <div>
                <div class="text-xs font-bold text-white leading-tight">নগদ</div>
                <div class="text-[10px] text-slate-400">Nagad Pay</div>
              </div>
            </div>
            <div id="nagad-radio-dot" class="w-4 h-4 rounded-full border-2 border-slate-600 flex items-center justify-center">
              <div class="w-2 h-2 rounded-full bg-transparent"></div>
            </div>
          </label>

        </div>
      </div>

      <!-- 2. Quick Amount Chips -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">
          টাকার পরিমাণ নির্বাচন করুন (BDT):
        </label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" class="quick-amt py-2 rounded-xl bg-[#0b1c47] hover:bg-[#122e6e] border border-[#163677] text-white text-xs font-bold transition text-center" onclick="setQuickAmount(500, this)">৳ ৫০০</button>
          <button type="button" class="quick-amt active py-2 rounded-xl bg-[#0b1c47] hover:bg-[#122e6e] border border-[#163677] text-white text-xs font-bold transition text-center" onclick="setQuickAmount(1000, this)">৳ ১,০০০</button>
          <button type="button" class="quick-amt py-2 rounded-xl bg-[#0b1c47] hover:bg-[#122e6e] border border-[#163677] text-white text-xs font-bold transition text-center" onclick="setQuickAmount(2000, this)">৳ ২,০০০</button>
          <button type="button" class="quick-amt py-2 rounded-xl bg-[#0b1c47] hover:bg-[#122e6e] border border-[#163677] text-white text-xs font-bold transition text-center" onclick="setQuickAmount(5000, this)">৳ ৫,০০০</button>
          <button type="button" class="quick-amt py-2 rounded-xl bg-[#0b1c47] hover:bg-[#122e6e] border border-[#163677] text-white text-xs font-bold transition text-center" onclick="setQuickAmount(10000, this)">৳ ১০,০০০</button>
          <button type="button" class="quick-amt py-2 rounded-xl bg-[#0b1c47] hover:bg-[#122e6e] border border-[#163677] text-white text-xs font-bold transition text-center" onclick="setQuickAmount(25000, this)">৳ ২৫,০০০</button>
        </div>
      </div>

      <!-- 3. Custom Amount Input -->
      <div>
        <label for="payment-amount" class="block text-xs font-semibold text-slate-300 mb-1">
          অথবা নির্দিষ্ট টাকার পরিমাণ লিখুন:
        </label>
        <div class="relative">
          <input 
            type="number" 
            id="payment-amount" 
            min="10" 
            step="1" 
            value="1000" 
            required 
            placeholder="যেমন: 1000" 
            class="w-full pl-8 pr-16 py-3 rounded-2xl bg-[#040d29] border border-[#193a7d] text-white text-sm font-bold font-mono placeholder-slate-500 focus:outline-none focus:border-[#38bdf8] transition"
          >
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 font-bold text-sm">৳</div>
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-emerald-400 font-bold text-xs">BDT</div>
        </div>
      </div>

      <!-- Feedback / Error Message -->
      <div id="payment-status-message" class="text-xs text-center font-semibold min-h-[16px] hidden"></div>

      <!-- Submit / Pay Now Button -->
      <button 
        type="submit" 
        id="pay-now-btn" 
        class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-white text-sm font-bold shadow-[0_4px_20px_rgba(16,185,129,0.35)] active:scale-95 transition flex items-center justify-center gap-2 cursor-pointer"
      >
        <span id="btn-spinner" class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin hidden"></span>
        <span id="btn-icon">⚡</span>
        <span id="btn-text">Pay Now (পেমেন্ট সম্পন্ন করুন)</span>
      </button>

    </form>

    <!-- Footer Security Notice -->
    <div class="text-center text-[10.5px] text-slate-400 border-t border-[#122e6b] pt-3 flex items-center justify-center gap-1.5">
      <span>🔒</span>
      <span>পেমেন্ট সরাসরি অফিশিয়াল গেটওয়ে সার্ভারে সুরক্ষিতভাবে প্রসেস হবে।</span>
    </div>

  </div>

  <!-- JavaScript Fetch Script -->
  <script>
    let currentPayType = 'BKASH';

    // 1. Method Switcher
    function selectMethod(method) {
      currentPayType = method;
      const bkashCard = document.getElementById('bkash-card');
      const nagadCard = document.getElementById('nagad-card');
      const bkashDot = document.getElementById('bkash-radio-dot');
      const nagadDot = document.getElementById('nagad-radio-dot');

      if (method === 'BKASH') {
        bkashCard.classList.add('active');
        nagadCard.classList.remove('active');
        bkashDot.className = 'w-4 h-4 rounded-full border-2 border-[#38bdf8] flex items-center justify-center';
        bkashDot.innerHTML = '<div class="w-2 h-2 rounded-full bg-[#38bdf8]"></div>';
        nagadDot.className = 'w-4 h-4 rounded-full border-2 border-slate-600 flex items-center justify-center';
        nagadDot.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';
      } else {
        nagadCard.classList.add('active');
        bkashCard.classList.remove('active');
        nagadDot.className = 'w-4 h-4 rounded-full border-2 border-[#38bdf8] flex items-center justify-center';
        nagadDot.innerHTML = '<div class="w-2 h-2 rounded-full bg-[#38bdf8]"></div>';
        bkashDot.className = 'w-4 h-4 rounded-full border-2 border-slate-600 flex items-center justify-center';
        bkashDot.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';
      }
    }

    // 2. Quick Amount Selector
    function setQuickAmount(amt, btnElement) {
      const input = document.getElementById('payment-amount');
      if (input) input.value = amt;

      document.querySelectorAll('.quick-amt').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    // 3. Initiate Payment (Fetch POST to Live Backend)
    async function initiatePayment() {
      const amountInput = document.getElementById('payment-amount');
      const statusMsg = document.getElementById('payment-status-message');
      const payBtn = document.getElementById('pay-now-btn');
      const btnSpinner = document.getElementById('btn-spinner');
      const btnIcon = document.getElementById('btn-icon');
      const btnText = document.getElementById('btn-text');

      const amount = parseFloat(amountInput.value);
      if (!amount || isNaN(amount) || amount < 10) {
        statusMsg.className = 'text-xs text-center font-semibold text-rose-400 py-1.5 bg-rose-500/10 rounded-xl border border-rose-500/30';
        statusMsg.textContent = 'অনুগ্রহ করে ন্যূনতম ১০ টাকা বা সঠিক রিচার্জ পরিমাণ দিন।';
        statusMsg.classList.remove('hidden');
        amountInput.focus();
        return;
      }

      // Generate a unique Order ID
      const orderId = 'ORD_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

      // Loading state
      payBtn.disabled = true;
      btnSpinner.classList.remove('hidden');
      btnIcon.classList.add('hidden');
      btnText.textContent = 'গেটওয়ে পেজে নিয়ে যাওয়া হচ্ছে...';
      statusMsg.className = 'text-xs text-center font-semibold text-sky-400 py-1.5 bg-sky-500/10 rounded-xl border border-sky-500/30 animate-pulse';
      statusMsg.textContent = 'পেমেন্ট গেটওয়ে লিংক প্রস্তুত হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...';
      statusMsg.classList.remove('hidden');

      try {
        const response = await fetch('/api/create-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            amount: Number(amount),
            orderId: orderId,
            payType: currentPayType // 'BKASH' or 'NAGAD'
          })
        });

        const data = await response.json();
        console.log('[Gateway Response]', data);

        // Extract payment URL from gateway response
        const paymentUrl = data?.gatewayResponse?.data?.url || 
                           data?.data?.url || 
                           data?.url || 
                           data?.paymentUrl;

        if (paymentUrl) {
          statusMsg.className = 'text-xs text-center font-bold text-emerald-400 py-1.5 bg-emerald-500/15 rounded-xl border border-emerald-500/30';
          statusMsg.textContent = '✅ সফল! পেমেন্ট ক্যাশিয়ার পেজে রিডাইরেক্ট করা হচ্ছে...';
          
          // Direct redirect to payment gateway
          window.location.href = paymentUrl;
        } else {
          const errorDetail = data?.message || data?.msg || data?.error || 'পেমেন্ট লিংক পাওয়া যায়নি।';
          statusMsg.className = 'text-xs text-center font-semibold text-rose-400 py-1.5 bg-rose-500/10 rounded-xl border border-rose-500/30';
          statusMsg.textContent = 'ত্রুটি: ' + errorDetail;
          statusMsg.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Payment Error:', error);
        statusMsg.className = 'text-xs text-center font-semibold text-rose-400 py-1.5 bg-rose-500/10 rounded-xl border border-rose-500/30';
        statusMsg.textContent = 'সার্ভার যোগাযোগে সমস্যা হয়েছে: ' + (error.message || 'Network Failed');
        statusMsg.classList.remove('hidden');
      } finally {
        payBtn.disabled = false;
        btnSpinner.classList.add('hidden');
        btnIcon.classList.remove('hidden');
        btnText.textContent = 'Pay Now (পেমেন্ট সম্পন্ন করুন)';
      }
    }
  </script>

</body>
</html>
