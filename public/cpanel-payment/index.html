<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>নিরাপদ অনলাইন পেমেন্ট | Secure Payment</title>
  <meta name="description" content="বিকাশ, নগদ এবং রকেটের মাধ্যমে নিরাপদ ও দ্রুত পেমেন্ট করুন">
  
  <!-- Google Fonts: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page-container">
    <div class="payment-card">
      
      <!-- Card Header -->
      <header class="card-header">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </div>
        <div>
          <h1 class="header-title">অনলাইন পেমেন্ট</h1>
          <p class="header-subtitle">বিকাশ, নগদ ও রকেট দিয়ে দ্রুত ও নিরাপদ পেমেন্ট</p>
        </div>
        <div class="secure-badge" title="256-bit SSL Secure Payment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>SSL Secured</span>
        </div>
      </header>

      <!-- Payment Form -->
      <form id="payment-form" novalidate>
        
        <!-- Section 1: Amount Selection -->
        <section class="form-section">
          <label for="amount-input" class="section-label">
            <span>টাকার পরিমাণ (BDT)</span>
            <span class="label-hint">সর্বনিম্ন ৳৩০০ — সর্বোচ্চ ৳৫০,০০০</span>
          </label>

          <!-- Quick Select Buttons -->
          <div class="quick-amount-grid" role="group" aria-label="দ্রুত টাকার পরিমাণ নির্বাচন">
            <button type="button" class="quick-amt-btn active" data-amount="300">৳ ৩০০</button>
            <button type="button" class="quick-amt-btn" data-amount="500">৳ ৫০০</button>
            <button type="button" class="quick-amt-btn" data-amount="1000">৳ ১,০০০</button>
            <button type="button" class="quick-amt-btn" data-amount="2000">৳ ২,০০০</button>
          </div>

          <!-- Amount Input -->
          <div class="input-wrapper">
            <span class="currency-prefix" aria-hidden="true">৳</span>
            <input 
              type="number" 
              id="amount-input" 
              name="amount" 
              class="amount-field" 
              value="300"
              min="300" 
              max="50000" 
              step="1" 
              inputmode="numeric" 
              placeholder="৩০০ থেকে ৫০,০০০ এর মধ্যে লিখুন"
              required
              aria-describedby="amount-error"
            >
          </div>
          <p id="amount-error" class="field-error hidden" role="alert"></p>
        </section>

        <!-- Section 2: Payment Method Selector -->
        <section class="form-section">
          <span class="section-label" id="method-group-label">পেমেন্ট মেথড নির্বাচন করুন</span>
          
          <div class="methods-grid" role="radiogroup" aria-labelledby="method-group-label">
            
            <!-- BKASH -->
            <label class="method-card selected" for="method-bkash">
              <input type="radio" id="method-bkash" name="payType" value="BKASH" checked>
              <div class="method-info">
                <span class="method-icon-badge bkash-badge" aria-hidden="true">bK</span>
                <div>
                  <span class="method-name">বিকাশ</span>
                  <span class="method-sub">bKash</span>
                </div>
              </div>
              <span class="custom-radio" aria-hidden="true"></span>
            </label>

            <!-- NAGAD -->
            <label class="method-card" for="method-nagad">
              <input type="radio" id="method-nagad" name="payType" value="NAGAD">
              <div class="method-info">
                <span class="method-icon-badge nagad-badge" aria-hidden="true">নগদ</span>
                <div>
                  <span class="method-name">নগদ</span>
                  <span class="method-sub">Nagad</span>
                </div>
              </div>
              <span class="custom-radio" aria-hidden="true"></span>
            </label>

          </div>
        </section>

        <!-- Status & Error Alert Container -->
        <div id="status-container" class="status-box hidden" role="alert" aria-live="polite">
          <div class="status-icon" aria-hidden="true"></div>
          <div class="status-content">
            <p id="status-title" class="status-title"></p>
            <p id="status-message" class="status-message"></p>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="pay-submit-btn">
          <span class="btn-spinner hidden" aria-hidden="true"></span>
          <span class="btn-lock-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <span id="btn-text">Pay Now (৳৩০০ পেমেন্ট করুন)</span>
        </button>

        <!-- Footer Notice -->
        <footer class="form-footer">
          <p>🔒 আপনার পেমেন্ট তথ্য এনক্রিপ্ট করা ও সম্পূর্ণ নিরাপদ।</p>
        </footer>

      </form>
    </div>
  </main>

  <!-- External JS -->
  <script src="script.js"></script>
</body>
</html>
