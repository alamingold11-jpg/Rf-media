:root[data-theme="dark"]{--bg:#061733;--soft:#0a2147;--text:#eaf3ff;--muted:#a3b8dc;--a:#4aa3ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans Arabic",sans-serif;line-height:1.7}
.w{max-width:900px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header .w{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--a)}
select{background:var(--soft);color:var(--text);border:0;border-radius:10px;padding:8px 10px;font-size:14px}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;margin:5px;font-size:15px;background:var(--soft);color:var(--a)}

.hero{padding:56px 0 52px;text-align:center}

.sub{color:var(--muted);max-width:580px;margin:0 auto 26px;font-size:17px}
.band{background:var(--soft)}
section{padding:46px 0}
h2{font-size:26px;margin:0 0 14px;line-height:1.3}
.lead p{color:var(--muted);font-size:17px;margin:0 0 14px;max-width:700px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:34px}
.it{display:flex;gap:16px;margin-bottom:22px}
.it span{font-size:26px;font-weight:800;color:var(--a);min-width:38px;opacity:.85}
.it b{display:block;font-size:17px}.it p{margin:3px 0 0;color:var(--muted);font-size:15px}
.free{text-align:center;padding:52px 0}

.nt{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:center}
.nt h2{font-size:21px}.nt p{margin:0;color:var(--muted);font-size:14px}
.nv{height:240px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
.nl{animation:up 16s linear infinite}.nv:hover .nl{animation-play-state:paused}

@media (prefers-reduced-motion:reduce){.nl{animation:none}}
.ni{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:12px;padding:11px 14px;margin-bottom:9px;font-size:14px}
.ni b{display:block}.ni small{color:#1f9d55;font-size:12px}.ni em{font-style:normal;font-weight:800;color:var(--a);font-size:16px}

.cta{text-align:center;padding:56px 0}
.ce{text-align:center}.ce p{color:var(--muted);margin:0}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}
.cs{background:var(--soft);border-radius:16px;padding:14px;cursor:pointer;border:0;color:var(--text);font:inherit;text-align:center;transition:transform .2s}.cs:hover{transform:translateY(-3px)}

.cf img{width:100%;height:100%;object-fit:contain}

footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 18px 38px}
footer a{color:var(--muted);margin:0 10px}
</style>
