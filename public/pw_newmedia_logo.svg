<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="PW New Media Logo">
  <defs>
    <!-- Rich deep brand gradient matching the uploaded badge -->
    <linearGradient id="pwBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32479c" />
      <stop offset="50%" stop-color="#283a85" />
      <stop offset="100%" stop-color="#1e2c69" />
    </linearGradient>
    <filter id="pwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071330" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Badge Body -->
  <rect x="8" y="8" width="184" height="184" rx="38" ry="38" fill="url(#pwBgGrad)" stroke="#455ec0" stroke-width="1.5" />

  <!-- Top Segmented Wireframe Globe / Satellite Dome -->
  <g transform="translate(100, 48)" fill="#FFFFFF">
    <!-- Top row segments -->
    <path d="M-13 -26 C-7 -29 7 -29 13 -26 L10 -22 C6 -24 -6 -24 -10 -22 Z" opacity="0.95"/>
    <path d="M-15 -21 C-20 -19 -25 -16 -28 -12 L-23 -10 C-20 -13 -16 -16 -12 -18 Z" opacity="0.95"/>
    <path d="M-10 -21 C-6 -23 6 -23 10 -21 L8 -17 C5 -18 -5 -18 -8 -17 Z" opacity="0.95"/>
    <path d="M15 -21 C12 -18 16 -16 20 -13 L25 -15 C22 -18 17 -20 12 -22 Z" opacity="0.95"/>

    <!-- Middle grid arched blocks -->
    <path d="M-36 -8 C-32 -13 -25 -17 -18 -19 L-15 -14 C-21 -12 -27 -9 -30 -5 Z" opacity="0.98"/>
    <path d="M-14 -14 C-10 -15 -4 -16 0 -16 C4 -16 10 -15 14 -14 L12 -9 C8 -10 4 -11 0 -11 C-4 -11 -8 -10 -12 -9 Z" opacity="0.98"/>
    <path d="M18 -19 C25 -17 32 -13 36 -8 L30 -5 C27 -9 21 -12 15 -14 Z" opacity="0.98"/>

    <!-- Bottom row grid tiles -->
    <path d="M-38 -3 C-38 -5 -37 -6 -35 -8 L-29 -5 C-30 -4 -30 -3 -30 -1 L-38 -1 Z" />
    <path d="M-27 -4 C-23 -6 -18 -8 -12 -9 L-10 -4 C-15 -3 -20 -1 -24 0 L-26 -4 Z" />
    <path d="M-9 -4 C-6 -5 -2 -5 0 -5 C2 -5 6 -5 9 -4 L8 0 C5 0 2 0 0 0 C-2 0 -5 0 -8 0 Z" />
    <path d="M12 -9 C18 -8 23 -6 27 -4 L24 0 C20 -1 15 -3 10 -4 Z" />
    <path d="M29 -5 L35 -8 C37 -6 38 -5 38 -3 L30 -1 C30 -3 30 -4 29 -5 Z" />
  </g>

  <!-- Big Bold Modern 'PW' Letters -->
  <g fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" font-weight="900">
    <!-- Stylized vector PW for pixel perfection across all platforms -->
    <!-- 'P' glyph -->
    <path d="M28 72 L62 72 C77 72 87 81 87 95 C87 109 77 118 62 118 L48 118 L48 138 L28 138 Z M48 89 L48 101 L60 101 C66 101 70 98 70 95 C70 92 66 89 60 89 Z" />
    
    <!-- 'W' glyph -->
    <path d="M89 72 L106 72 L120 120 L134 72 L150 72 L164 120 L178 72 L195 72 L174 138 L155 138 L142 93 L129 138 L110 138 Z" />
  </g>

  <!-- Clean Subtitle 'NewMedia' -->
  <text x="100" y="168" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="600" 
        font-size="29.5" 
        letter-spacing="-0.5">NewMedia</text>
</svg>
